[package]
name = "urinote"
version = "0.1.0"
description = "Urinote - sticky notes for desktop and mobile"
authors = ["zzanghi"]
license = "MIT"
repository = "https://github.com/zzanghi21/urinote"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "urinote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent background for sticky note windows (macOS)
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "fs"] }
anyhow = "1"
log = "0.4"
# Error log (app log folder; never records note contents)
tauri-plugin-log = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Friend sharing (same-Wi-Fi P2P). Mobile support comes in M4
iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
# Windows Credential Manager / macOS Keychain / Linux Secret Service (GNOME Keyring, KWallet); falls back to a file
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
gethostname = "1"
n0-future = "0.3"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# Auto-update from GitHub Releases (signed with the key in GitHub Secrets) and relaunch
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
