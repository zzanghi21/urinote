# Build installers: pushing a v* tag builds Windows / macOS / Ubuntu installers and
# uploads them to a draft GitHub Release. Not code-signed yet (M6).
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - os: macos-latest # Intel Mac
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04 # .deb / .AppImage / .rpm
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev pkg-config patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: uri-memo/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: uri-memo/src-tauri
      - run: npm ci
        working-directory: uri-memo
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update files; the app verifies them with the public key in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: uri-memo
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Urinote ${{ github.ref_name }}
          # Draft until reviewed. Publishing it makes latest.json live, so installed apps update.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # Also make installers downloadable from the Actions page for manual runs (no tag)
      - uses: actions/upload-artifact@v4
        with:
          name: urinote-${{ runner.os }}-${{ strategy.job-index }}
          # installers only (not intermediate folders such as the AppImage AppDir)
          path: |
            uri-memo/src-tauri/target/**/release/bundle/deb/*.deb
            uri-memo/src-tauri/target/**/release/bundle/rpm/*.rpm
            uri-memo/src-tauri/target/**/release/bundle/appimage/*.AppImage
            uri-memo/src-tauri/target/**/release/bundle/dmg/*.dmg
            uri-memo/src-tauri/target/**/release/bundle/msi/*.msi
            uri-memo/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn
